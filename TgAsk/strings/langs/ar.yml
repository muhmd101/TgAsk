start_msg: |
  **مرحبًا** {mention}.

  أنا [{name}](t.me/{username})، مساعد ذكي داخل Telegram يجيب على أسئلتك مباشرة في أي محادثة.

  **يمكنك استخدامي كـ:**
  · مساعد معلومات — اسألني أي سؤال وسأجيبك فورًا.
  · مساعد في المحادثات — أرسل الإجابات في أي دردشة دون الخروج منها.

  جرب:
  `@{username} ما هو الذكاء الاصطناعي؟`
inline_query_msg: |
  **السؤال**
  {query}

  __جاري الحصول على الإجابة...__

support_ask_amount: |
  **كم نجمة تريد التبرع بها؟**
  اكتب رقمًا، مثلاً `5` أو `50`.

support_invoice_title: "ادعم البوت"
support_invoice_description: "تبرعك يساعد البوت على الاستمرار والتطور. شكرًا."
support_timeout: |
  **انتهى الوقت.**
  لم ترد خلال {timeout} ثانية. أرسل /support للمحاولة مجددًا.

support_invalid_amount: |
  **رقم غير صحيح.**
  أرسل /support وأدخل رقمًا صحيحًا.

support_thanks: |
  **شكرًا على {amount} نجمة.**
  تبرعك يصنع فرقًا حقيقيًا.

support_invalid_range: |
  **خارج النطاق المسموح.**
  أدخل رقمًا بين **1** و **10,000** نجمة.
  أرسل /support وحاول مجددًا.

error_msg: |
  **حدث خطأ ما.**
  حدث خطأ أثناء معالجة طلبك. يرجى المحاولة لاحقًا.